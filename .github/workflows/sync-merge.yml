name: sync-merge
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch sync branch chunks
        run: |
          git fetch origin sync-tree-225
          mkdir -p /tmp/tree
          git archive origin/sync-tree-225 tree-chunks | tar -x -C /tmp/tree
      - name: Reassemble and extract merged tree
        run: |
          cd /tmp/tree/tree-chunks
          cat chunk-* | base64 -d > /tmp/merged.tar.gz
          mkdir -p /tmp/merged
          tar xzf /tmp/merged.tar.gz -C /tmp/merged
      - name: Rsync merged tree onto main (exclude workflows)
        run: |
          rsync -a --delete --exclude=.git --exclude=.github/workflows/ /tmp/merged/hghubx-merge/ ./
          git status --short | head -30
      - name: Commit and push
        run: |
          git config user.name "Hu0212531"
          git config user.email "c760ann@gmail.com"
          git add -A
          git commit -m "sync upstream v2.2.5, keep wake lock + auto-update check" || echo "nothing to commit"
          git push origin main
