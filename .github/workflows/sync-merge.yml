name: sync upstream merge (one-off)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-merge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge upstream v2.2.2 and resolve conflicts
        run: |
          set -e
          git config user.name "Rocky HGhubX sync"
          git config user.email "rocky@local"
          git remote add upstream https://github.com/zxsos/HGhubX.git || true
          git fetch upstream
          git fetch origin sync-helper
          git merge upstream/main --no-edit || true
          git checkout origin/sync-helper -- src/app/App.tsx src/features/settings/Settings.tsx scripts/fixtures/app-ui.mjs src/shared/ui/UpdatePrompt.tsx
          git rm -f scripts/test-mobile-layout.mjs src-tauri/src/api.rs || true
          git rm -f src/components/UpdatePrompt.tsx || true
          git add -A
          git status --short | head -30
          git commit -m "sync upstream v2.2.2, keep wake lock + auto-update check" || echo "nothing to commit"
          git push origin main
