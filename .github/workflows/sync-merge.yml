name: sync upstream merge (one-off)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-merge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set main tree from 2.2.2 tarball
        run: |
          set -e
          git config user.name "Rocky HGhubX sync"
          git config user.email "rocky@local"
          git fetch origin sync-tree
          rm -f /tmp/tree.tar.gz.b64 /tmp/tree.tar.gz
          mkdir -p /tmp/tree
          for i in 00 01 02 03 04 05 06 07 08 09 10 11; do
            git show origin/sync-tree:tree-chunks/chunk-$i >> /tmp/tree.tar.gz.b64
          done
          base64 -d /tmp/tree.tar.gz.b64 > /tmp/tree.tar.gz
          tar -xzf /tmp/tree.tar.gz -C /tmp/tree
          echo "extracted files: $(find /tmp/tree -type f | wc -l)"
          test -f /tmp/tree/src/useWakeLock.ts
          test -f /tmp/tree/src/updateCheck.ts
          rsync -a --delete --exclude=.git --exclude=.github/workflows/ /tmp/tree/ ./
          git add -A
          git status --short | head -40
          git commit -m "sync upstream v2.2.2, keep wake lock + auto-update check" || echo "nothing to commit"
          git push origin main
